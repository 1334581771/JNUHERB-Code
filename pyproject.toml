[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jnuherb"
version = "0.1.0"
description = "JNUHERB — A Network Pharmacology Analysis Tool for Traditional Chinese Medicine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "JNUHERB Team", email = "jnuherb@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "streamlit>=1.28.0",
    "gseapy>=1.0.0",
    "requests>=2.28.0",
    # kaleido 0.2.1 bundles its own Chromium and works on headless servers.
    # Newer 1.x versions require a system Chrome installation.
    "kaleido==0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]
# Molecular docking (the "Docking" tab). vina needs a C++ toolchain +
# boost at build time; see Dockerfile for the containerized install.
docking = [
    "rdkit>=2023.3",
    "meeko>=0.5",
    "gemmi>=0.6",
    "scipy>=1.10",
    "prody>=2.4",
    "vina>=1.2.3",
    "py3Dmol>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jnuherb = ["data/*.csv", "data/*.csv.gz", "data/*.db", "data/*.json", "data/enrichment/*.gmt", "data/fonts/*.otf", "data/fonts/*.ttf", "data/ensembl_uniprot.csv"]

[project.scripts]
jnuherb = "jnuherb.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
