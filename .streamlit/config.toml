[server]
# JNUHERB Streamlit server configuration
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = true
runOnSave = false

# Headless mode for Docker / production deployments
headless = true

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"

[theme]
primaryColor = "#3c8dbc"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#2c3e50"
font = "sans serif"

[logger]
level = "info"
